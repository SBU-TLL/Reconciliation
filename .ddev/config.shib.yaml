# DDEV override: local-dev Shibboleth auth simulation + composer root.
# Merged on top of config.yaml by DDEV. Lives under .ddev/ — never deployed to Azure.
#
# APP_ENV gates the auth mock (.ddev/php/shib_dev_prepend.php); it defaults to
# "production" off-DDEV, so the mock cannot activate outside local development.
# MOCK_* seed the Shibboleth attributes (eppn/nickname/sn) the API reads.
# Switch users with: ddev config --web-environment-add="MOCK_EPPN=pstdenis@stonybrook.edu"
# (pstdenis@/ikleiman@/vlgarcia@/chaotsai@stonybrook.edu are admins).
web_environment:
  - APP_ENV=local
  - MOCK_EPPN=test.student@stonybrook.edu
  - MOCK_NICKNAME=Test
  - MOCK_SN=Student

# The Slim API's composer root is api/ (require "../vendor/autoload.php").
composer_root: api
