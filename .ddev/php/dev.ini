; DDEV-only PHP settings for Reconciliation local development.
; Loaded ONLY inside the DDEV container — never deployed to Azure.
;
; auto_prepend_file transparently runs the hardened Shibboleth auth mock before
; every PHP request, so no application source is edited. The prepend is
; fail-closed and gated on APP_ENV (see shib_dev_prepend.php).
auto_prepend_file = /var/www/html/.ddev/php/shib_dev_prepend.php

display_errors = On
display_startup_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE
